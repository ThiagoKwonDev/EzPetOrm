<app-botao-voltar></app-botao-voltar>

<div class="ms-3 mb-3 flex items-center gap-3">
    <button mat-fab extended color="primary" (click)="abrirModal(null)">
        <mat-icon>add</mat-icon>
        Cadastrar
    </button>
</div>

<table mat-table [dataSource]="listaPets" class="mat-elevation-z8 w-full m-4">
    <!-- Coluna: ID -->
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let pet"> {{ pet.id }} </td>
    </ng-container>

    <!-- Coluna: Nome -->
    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let pet"> {{ pet.nome }} </td>
    </ng-container>

    <!-- Coluna: Espécie -->
    <ng-container matColumnDef="especie">
        <th mat-header-cell *matHeaderCellDef> Espécie </th>
        <td mat-cell *matCellDef="let pet"> {{ pet.especie }} </td>
    </ng-container>

    <!-- Coluna: Raça -->
    <ng-container matColumnDef="raca">
        <th mat-header-cell *matHeaderCellDef> Raça </th>
        <td mat-cell *matCellDef="let pet"> {{ pet.raca }} </td>
    </ng-container>

    <!-- Coluna: Idade -->
    <ng-container matColumnDef="idade">
        <th mat-header-cell *matHeaderCellDef> Idade </th>
        <td mat-cell *matCellDef="let pet"> {{ pet.idade }} anos </td>
    </ng-container>

    <!-- Coluna: Restrições -->
    <ng-container matColumnDef="restricoes">
        <th mat-header-cell *matHeaderCellDef> Restrições </th>
        <td mat-cell *matCellDef="let pet"> {{ pet.restricoes || 'Nenhuma' }} </td>
    </ng-container>

    <!-- Coluna: Tutor -->
    <ng-container matColumnDef="tutor">
        <th mat-header-cell *matHeaderCellDef> Tutor </th>
        <td mat-cell *matCellDef="let pet"> {{ pet.tutor }} </td>
    </ng-container>

    <!-- Coluna: Ações -->
    <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let pet">
            <button mat-icon-button color="accent" (click)="abrirModal(pet)">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
