<app-botao-voltar></app-botao-voltar>

<div class="ms-3 mb-3 flex items-center gap-3">
    <button mat-fab extended color="primary" (click)="abrirModal(null)">
        <mat-icon>add</mat-icon>
        Cadastrar
    </button>
</div>

<table mat-table [dataSource]="listaPrestadores" class="mat-elevation-z8 w-full m-4">

    <!-- Coluna: ID -->
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let prestador"> {{ prestador.id }} </td>
    </ng-container>

    <!-- Coluna: Nome -->
    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let prestador"> {{ prestador.nome }} </td>
    </ng-container>

    <!-- Coluna: Email -->
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let prestador"> {{ prestador.email }} </td>
    </ng-container>

    <!-- Coluna: Telefone -->
    <ng-container matColumnDef="telefone">
        <th mat-header-cell *matHeaderCellDef> Telefone </th>
        <td mat-cell *matCellDef="let prestador"> {{ prestador.telefone }} </td>
    </ng-container>

    <!-- Coluna: Endereço -->
    <ng-container matColumnDef="endereco">
        <th mat-header-cell *matHeaderCellDef> Endereço </th>
        <td mat-cell *matCellDef="let prestador"> {{ prestador.endereco }} </td>
    </ng-container>

    <!-- Coluna: Ações -->
    <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let prestador">
            <button mat-icon-button color="accent" (click)="abrirModal(prestador)">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
