<app-botao-voltar></app-botao-voltar>

<div class="ms-3 mb-3 flex items-center gap-3">
    <button mat-fab extended color="primary" (click)="abrirModal(null)">
        <mat-icon>add</mat-icon>
        Cadastrar
    </button>
</div>

<table mat-table [dataSource]="listaServicos" class="mat-elevation-z8 w-full p-4">

    <!-- Coluna: ID -->
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let servico"> {{ servico.id }} </td>
    </ng-container>

    <!-- Coluna: Título -->
    <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef> Título </th>
        <td mat-cell *matCellDef="let servico"> {{ servico.titulo }} </td>
    </ng-container>

    <!-- Coluna: Descrição -->
    <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let servico"> {{ servico.descricao }} </td>
    </ng-container>

    <!-- Coluna: Preço -->
    <ng-container matColumnDef="preco">
        <th mat-header-cell *matHeaderCellDef> Preço </th>
        <td mat-cell *matCellDef="let servico"> {{ servico.preco }} </td>
    </ng-container>

    <!-- Coluna: Ações -->
    <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let servico">
            <button mat-icon-button color="accent" (click)="abrirModal(servico)">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
